<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE GODPOSTER</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0b0e'/%3E%3Crect x='2' y='2' width='12' height='12' fill='none' stroke='%23e8b931' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="wordmark">THE <b>GOD</b>POSTER</div>
  <ol class="steps"><li class="on">1 ADD PHOTOS</li><li>2 DESIGN</li><li>3 EXPORT</li></ol>
  <div class="sizes" id="sizes">
    <button class="tab" data-size="landscape" data-w="1920" data-h="1080">1920×1080 LANDSCAPE</button>
    <button class="tab" data-size="portrait" data-w="1080" data-h="1350">1080×1350 PORTRAIT</button>
    <button class="tab" data-size="square" data-w="1080" data-h="1080">1080×1080 SQUARE</button>
  </div>
  <button class="export" id="exportAll" title="Arrives in Session 4">EXPORT ALL 3 SIZES</button>
</header>

<main class="studio">
  <aside class="rail left">
    <h2>PHOTOS <span id="photoCount" class="count">0</span></h2>
    <div class="drop" id="drop" tabindex="0">Drop photos here or click <b>Add photos</b></div>
    <button class="btn gold" id="addPhotos">ADD PHOTOS</button>
    <div class="thumbs" id="thumbs"></div>

    <h2>PANEL</h2>
    <div class="chips" id="chips"></div>
    <label class="slider">ZOOM <output id="zoomOut">1.00×</output>
      <input type="range" id="zoom" min="1" max="4" step="0.01" value="1"></label>
    <div class="btns">
      <button class="btn" id="autoCenter">AUTO CENTER</button>
      <button class="btn" id="replace">REPLACE PHOTO</button>
      <button class="btn" id="fillAll">FILL ALL PANELS FROM THIS PHOTO</button>
      <button class="btn" id="spread">SPREAD PHOTOS ACROSS PANELS</button>
    </div>
    <p class="hint">Drag a panel in the preview to move its photo, scroll to zoom, double-click to re-centre.</p>
  </aside>

  <section class="centre"><canvas id="stage" width="1920" height="1080"></canvas></section>

  <aside class="rail right">
    <h2>LAYOUT</h2>
    <div class="layouts" id="layouts"></div>
    <h2>GRADE</h2>
    <div class="grades" id="grades"></div>
    <div class="sliders">
      <label class="slider">STRENGTH <output></output><input type="range" id="g-strength" min="0" max="100"></label>
      <label class="slider">CONTRAST <output></output><input type="range" id="g-contrast" min="50" max="200"></label>
      <label class="slider">SATURATION <output></output><input type="range" id="g-saturation" min="0" max="200"></label>
      <label class="slider">GRAIN <output></output><input type="range" id="g-grain" min="0" max="100"></label>
      <label class="slider">VIGNETTE <output></output><input type="range" id="g-vignette" min="0" max="100"></label>
    </div>
  </aside>
</main>

<footer class="bottombar"><span class="dot"></span><span id="status">Ready. Add some photos to begin.</span></footer>
<input type="file" id="file" accept="image/*" multiple hidden>
<input type="file" id="fileReplace" accept="image/*" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
